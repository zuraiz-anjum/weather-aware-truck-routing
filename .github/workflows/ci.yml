name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  # The real services, so that a change in what they accept shows up here
  # rather than in production. Advisory: the public servers have off days.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: LIVE_SERVICES=1 python manage.py test trips.tests.test_live

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The built app in a real browser: the map's worker, tiles and layers
      # are beyond jsdom, and the dev server hides what bundling changes.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t truckweather .
      - name: Start the container and wait for it to answer
        run: |
          docker run -d --name app -p 8000:8000 -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=trucks.example.com truckweather
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: The front page is served by the same container
        run: curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
