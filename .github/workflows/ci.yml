name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t truckweather .
      - name: Start the container and wait for it to answer
        run: |
          docker run -d --name app -p 8000:8000 -e DJANGO_SECRET_KEY=ci truckweather
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: The front page is served by the same container
        run: curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
